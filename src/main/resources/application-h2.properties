spring.datasource.url=jdbc:h2:file:~/navdata_flowcash
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=9091
auth.api.base-url=${AUTH_API_BASE_URL:http://localhost:9090}

# Exibe o passo a passo dos filtros do Spring Security (autenticação, CORS, bloqueios)
logging.level.org.springframework.security=TRACE
#logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=DEBUG

# Exibe os comandos SQL executados no terminal
logging.level.org.hibernate.SQL=DEBUG

# Exibe os valores reais das variáveis preenchidas no SQL (ex: IDs, e-mails, senhas)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Exibe detalhes do Spring Web (roteamento de requisições e parâmetros)
logging.level.org.springframework.web=DEBUG

# Formata o SQL no terminal para ficar legível em várias linhas
spring.jpa.properties.hibernate.format_sql=true

# Segredos (injetados via variáveis de ambiente, veja application-h2.properties.example)
jwt.secret=${JWT_SECRET}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

# Cookie do refreshToken marcado como Secure apenas em HTTPS
app.cookie.secure=false

cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://*.navdata.com.br,https://navdata.com.br,https://ais-dev-jfgnclaxjozjt2x3hxhyqw-57018275449.us-east1.run.app,https://auth-navdata.loca.lt
