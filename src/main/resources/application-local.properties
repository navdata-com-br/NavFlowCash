# Configuração da Base de Dados PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/navdata_flowcash
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta e Console (Opcional para dev local)
server.port=9091
auth.api.base-url=${AUTH_API_BASE_URL:http://localhost:9090}

# Logs de desenvolvimento
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Segredos (fallback local para evitar falhas de bootstrap sem variáveis de ambiente)
jwt.secret=${JWT_SECRET}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

# Cookie do refreshToken marcado como Secure apenas em HTTPS
app.cookie.secure=false

cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://*.navdata.com.br,https://navdata.com.br,https://ais-dev-jfgnclaxjozjt2x3hxhyqw-57018275449.us-east1.run.app,https://auth-navdata.loca.lt
