spring.application.name=auth

# 1. URL e Credenciais (usam variáveis de ambiente, veja application-prod.properties.example)
spring.datasource.url=jdbc:postgresql://navdata-db:5432/navdata_flowcash
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 2. O Driver agora é do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. O Dialeto (a língua que o Hibernate fala com o banco)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Manter o resto como está
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Sao_Paulo

# 4. ATENÇÃO: Sua porta mudou para 9090
server.port=8081
auth.api.base-url=${AUTH_API_BASE_URL}

# Logs (ótimo para vermos se o JWT e o Auth estão funcionando)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Segredos (fallback para evitar falhas de bootstrap sem ambiente configurado)
jwt.secret=${JWT_SECRET}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

# Em produção o cookie do refreshToken é marcado como Secure (HTTPS)
app.cookie.secure=true

cors.allowed-origins=https://*.navdata.com.br
